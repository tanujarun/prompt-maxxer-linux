[package]
name = "prompt-maxxer"
version = "0.1.0"
description = "Prompt Maxxer - push-to-talk dictation"
authors = ["Prompt Maxxer"]
edition = "2021"

[lib]
name = "prompt_maxxer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The overlay is a layer-shell surface (see src/layer.rs), set up through the
# window's GTK handle. Same gtk version Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
